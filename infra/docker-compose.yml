services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escrova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escrova_password}
      POSTGRES_DB: ${POSTGRES_DB:-escrova_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-escrova} -d $${POSTGRES_DB:-escrova_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-escrova_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-escrova_minio_password}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: minio/mc:latest

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-escrova_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-escrova_minio_password}
      STORAGE_PRODUCT_IMAGES_BUCKET: ${STORAGE_PRODUCT_IMAGES_BUCKET:-escrova-product-images}

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${STORAGE_PRODUCT_IMAGES_BUCKET};
      mc anonymous set download local/$${STORAGE_PRODUCT_IMAGES_BUCKET};
      "

volumes:
  postgres_data:
  minio_data:

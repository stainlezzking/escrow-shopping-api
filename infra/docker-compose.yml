services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escrova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escrova_password}
      POSTGRES_DB: ${POSTGRES_DB:-escrova_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-escrova} -d $${POSTGRES_DB:-escrova_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
